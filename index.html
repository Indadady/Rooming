    <script type="text/babel" data-presets="react">
        const { useState, useRef, useMemo, useEffect } = React;

        const TM_LOGO = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgHfgIX70O5k6Anuo0UgALIdaG9jSga9auHu3uyz0uEirylGPAJnjN_qQbvEGMUvPqUQf_g9FMNUHRxlDcUBf4vZ3Mpy4TnA9WxbmzWYK11gt2zuy_Irl4wctNFjcjLyPo0GPXV792o_J7L9guRMuDfeC1gy7USwywjYbECZgzcsHybuGRRAXAnO1eNmP8/s320/logo.png";
        const TM_FOOTER_LOGO = "https://blogger.googleusercontent.com/img/a/AVvXsEitI-Z-hD82keOJ1AqHw-VTZjpw2U-O5UjtV9h3zblyG0wjsVfBWe9X9o0Q_Spctrt7krkd9qXO0xKTmGJLw4gyMZrRqpshKMFttnyx6OcC8-IGz3XLUZpGQOnRqVdol8jz5HuoDLqsEifnVRhcjUJHm13Sz8JrX9aPswMNUwZPvGtJEnQjhc2PiXlo-B8";

        const generateEventCode = () => Math.random().toString(36).substring(2, 8).toUpperCase();

        // 루밍 인쇄·페이지 분할 (최대 200명 / 대규모 단체 A4 안전 출력)
        const ROOMING_MAX_PAX = 200;
        const ROOMING_BASE_FONT = 10.5;
        const ROOMING_LARGE_ROOM_THRESHOLD = 22;
        const ROOMING_PAGE_FILL_SMALL = 0.92;
        const ROOMING_PAGE_FILL_LARGE = 0.86;

        const getRoomPrintWeight = (room, isInternational, fontSize) => {
            const fontScale = fontSize / ROOMING_BASE_FONT;
            const guestSlots = Math.max(1, Array.isArray(room.guests) ? room.guests.length : 2);
            const hasLongEngName = isInternational && room.guests.some(g => String(g.engName || '').trim().length > 18);
            const lineWeight = isInternational ? 2.15 : 1.05;
            const overhead = 1.25;
            return (overhead + guestSlots * lineWeight + (hasLongEngName ? 0.6 : 0)) * fontScale;
        };

        const getRoomColumnLimit = (pageIdx, isInternational, fontSize, isLargeGroup) => {
            const fontScale = fontSize / ROOMING_BASE_FONT;
            const intlFactor = isInternational ? 0.9 : 1;
            const firstBase = isLargeGroup ? 46 : 58;
            const nextBase = isLargeGroup ? 56 : 70;
            const baseLimit = pageIdx === 0 ? firstBase : nextBase;
            return (baseLimit * intlFactor) / fontScale;
        };

        const buildRoomPages = (normalizedRooms, isInternational, fontSize) => {
            const mappedRooms = normalizedRooms.map((r, idx) => ({ room: r, actualIdx: idx + 1, globalIdx: idx }));
            const isLargeGroup = mappedRooms.length > ROOMING_LARGE_ROOM_THRESHOLD;
            const fillTarget = isLargeGroup ? ROOMING_PAGE_FILL_LARGE : ROOMING_PAGE_FILL_SMALL;
            const roomPages = [];
            let currentRoomIndex = 0;
            let rpIdx = 0;

            while (currentRoomIndex < mappedRooms.length) {
                const columnLimit = getRoomColumnLimit(rpIdx, isInternational, fontSize, isLargeGroup) * fillTarget;
                let bestN = 0;

                for (let n = 1; n <= mappedRooms.length - currentRoomIndex; n++) {
                    const testRooms = mappedRooms.slice(currentRoomIndex, currentRoomIndex + n);
                    const half = Math.ceil(testRooms.length / 2);
                    const lWeight = testRooms.slice(0, half).reduce((sum, r) => sum + getRoomPrintWeight(r.room, isInternational, fontSize), 0);
                    const rWeight = testRooms.slice(half).reduce((sum, r) => sum + getRoomPrintWeight(r.room, isInternational, fontSize), 0);
                    if (lWeight <= columnLimit && rWeight <= columnLimit) bestN = n;
                    else break;
                }
                if (bestN === 0) bestN = 1;

                roomPages.push({ pageIndex: rpIdx, data: mappedRooms.slice(currentRoomIndex, currentRoomIndex + bestN) });
                currentRoomIndex += bestN;
                rpIdx++;
            }

            return { roomPages, totalRoomPages: roomPages.length, isLargeGroup };
        };

        const getRomanization = (char) => {
            const CHO = ["G","KK","N","D","TT","R","M","B","PP","S","SS","","J","JJ","CH","K","T","P","H"];
            const JUNG = ["A","AE","YA","YAE","EO","E","YEO","YE","O","WA","WAE","OE","YO","U","WO","WE","WI","YU","EU","UI","I"];
            const JONG = ["","K","K","K","N","N","N","T","L","L","M","P","L","L","P","L","M","P","P","T","T","NG","T","T","K","T","P","T"];
            const code = char.charCodeAt(0) - 0xAC00;
            if (code < 0 || code > 11171) return char; 
            return CHO[Math.floor(code / 588)] + JUNG[Math.floor((code % 588) / 28)] + JONG[code % 28];
        }

        const koreanToEnglish = (name) => {
            if (!name) return "";
            const fNames = {"김":"KIM", "이":"LEE", "박":"PARK", "최":"CHOI", "정":"JUNG", "강":"KANG", "조":"CHO", "윤":"YOON", "장":"JANG", "임":"LIM", "홍":"HONG", "송":"SONG", "오":"OH", "서":"SEO", "신":"SHIN", "권":"KWON", "황":"HWANG", "안":"AHN", "유":"YOO", "전":"JEON", "배":"BAE", "고":"KO", "문":"MOON", "양":"YANG", "손":"SON", "백":"BAEK", "허":"HEO", "남":"NAM", "심":"SHIM", "노":"NOH", "하":"HA", "곽":"KWAK", "성":"SUNG", "차":"CHA", "주":"JOO", "우":"WOO", "구":"KOO", "나":"NA", "민":"MIN", "엄":"EOM", "채":"CHAE", "원":"WON", "방":"BANG", "공":"KONG"};
            const char1 = name.charAt(0);
            const engFamily = fNames[char1] || getRomanization(char1);
            let engGiven = "";
            for(let i = 1; i < name.length; i++) engGiven += getRomanization(name.charAt(i));
            return `${engFamily} ${engGiven}`.trim(); 
        };

        const AutoResizeTextarea = ({ value, onChange, placeholder, minRows = 4 }) => {
            const textareaRef = useRef(null);
            const handleChange = (e) => onChange(e.target.value);
            useEffect(() => {
                if (textareaRef.current) {
                    textareaRef.current.style.height = 'auto';
                    textareaRef.current.style.height = Math.max(textareaRef.current.scrollHeight, minRows * 24 + 32) + 'px';
                }
            }, [value, minRows]);
            return <textarea ref={textareaRef} className="w-full p-3 md:p-4 text-xs md:text-sm bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition font-mono leading-relaxed resize-none overflow-hidden" placeholder={placeholder} value={value} onChange={handleChange} rows={minRows} />;
        };

        const HeaderField = ({ label, value = "", onChange, isMain = false, fontSize, placeholder = "", readOnly = false }) => (
            <div className="flex items-center gap-2 print:gap-4 w-full box-border">
                <span className={`font-black text-slate-500 tracking-widest uppercase flex-shrink-0 whitespace-nowrap`} 
                      style={{ fontSize: `${isMain ? Math.max(9, fontSize - 1) : Math.max(8, fontSize - 1.5)}pt`, width: `${Math.max(140, fontSize * 11)}px` }}>
                    {label}
                </span>
                <input 
                    type="text" 
                    className={`flex-1 min-w-0 border-b border-transparent ${readOnly ? '' : 'hover:border-slate-300 focus:border-blue-500'} outline-none px-2 transition-all text-slate-800 ${isMain ? 'font-black' : 'font-bold'}`}
                    style={{ fontSize: `${isMain ? fontSize + 4 : fontSize}pt` }}
                    value={value} 
                    placeholder={placeholder}
                    onChange={(e) => !readOnly && onChange(e.target.value)} 
                    readOnly={readOnly}
                />
            </div>
        );

        const EditableCell = ({ val = "", onChange, bold = false, uppercase = false, placeholder = '', center = false, fontSize }) => (
            <input 
                type="text"
                title="클릭하여 내용을 수정하세요"
                className={`editable-cell-input bg-transparent outline-none border-b border-transparent focus:border-blue-400 p-0 m-0 ${bold ? 'font-black text-slate-900' : ''} ${uppercase ? 'uppercase' : ''} ${center ? 'text-center' : 'text-left'}`}
                style={{ fontSize: 'inherit' }}
                value={val}
                placeholder={placeholder}
                onChange={(e) => onChange(e.target.value)}
            />
        );

        const RoomRow = ({ room, actualIdx, globalIdx, updateRoom, updateGuest, changeRoomType, removeRoom, dragRoomStart, dragRoomEnter, dragRoomEnd, dropRoom, fontSize, isInternationalRooming, isSharedMode }) => {
            const roomNoFontSize = Math.round(fontSize * 2.1 * 10) / 10; /* 기본 3배 → 30% 축소(2.1배) */
            return (
            <div
                className="room-row room-grid group relative bg-white w-full h-full border-b-2 border-slate-300 box-border"
                style={{ breakInside: 'avoid' }}
                draggable={!isSharedMode}
                onDragStart={!isSharedMode ? (e) => dragRoomStart(e, globalIdx) : undefined}
                onDragEnter={!isSharedMode ? (e) => dragRoomEnter(e, globalIdx) : undefined}
                onDragEnd={!isSharedMode ? dragRoomEnd : undefined}
                onDrop={!isSharedMode ? dropRoom : undefined}
                onDragOver={!isSharedMode ? (e) => e.preventDefault() : undefined}
            >
                <div className={`no-print flex items-center justify-center border-r border-slate-200 text-slate-300 ${!isSharedMode ? 'hover:text-blue-500 drag-handle' : ''}`} title={!isSharedMode ? "드래그하여 방 순서 변경" : ""}>
                    <i className="fas fa-bars"></i>
                </div>

                <div className="flex items-center justify-center border-r border-slate-200 py-1 bg-slate-50">
                    <span className="font-bold text-slate-700 text-center" style={{ fontSize: `${fontSize}pt` }}>{actualIdx}</span>
                </div>

                <div className="flex items-center justify-center border-r border-slate-200 py-1 px-1">
                    <select className="font-bold text-slate-600 bg-transparent outline-none cursor-pointer w-full text-center" style={{ fontSize: `${Math.max(8, fontSize - 1)}pt` }} value={room.type} onChange={(e) => changeRoomType(globalIdx, e.target.value)}>
                        <option value="TWIN">TWN</option><option value="TRIPLE">TRP</option><option value="SINGLE">SGL</option><option value="QUAD">QUAD</option>
                    </select>
                </div>

                <div className="flex flex-col py-0.5 bg-white min-w-0 border-r border-slate-200 justify-center">
                    {room.guests.map((g, gIdx) => (
                        <div key={gIdx} className={`flex flex-col px-1.5 md:px-2 py-1 ${gIdx > 0 ? 'room-guest-divider' : ''}`} style={{ padding: `${fontSize/2.5}px 4px` }}>
                            <div className="flex items-center gap-1 md:gap-2 w-full min-w-0">
                                {/* 웹 화면용 입력 필드 */}
                                <input className="room-screen-input font-bold outline-none bg-transparent focus:text-blue-600 min-w-0 flex-shrink-0" style={{ fontSize: `${fontSize}pt`, width: `${Math.max(60, fontSize * 5)}px` }} value={g.name} placeholder="이름" onChange={(e) => updateGuest(globalIdx, gIdx, 'name', e.target.value)} />
                                {/* 인쇄 전용 텍스트 필드 (긴 글자 줄바꿈 용도) */}
                                <div className="room-print-text font-bold text-slate-900 flex-shrink-0" style={{ fontSize: `${fontSize}pt`, width: `${Math.max(60, fontSize * 5)}px` }}>{g.name || ' '}</div>
                                
                                <button type="button" onClick={() => updateGuest(globalIdx, gIdx, 'gender', g.gender === '남' ? '여' : '남')} className={`flex-shrink-0 font-bold px-1.5 py-0.5 rounded cursor-pointer ${g.gender === '여' ? 'bg-pink-50 text-pink-600' : 'bg-blue-50 text-blue-600'}`} style={{ fontSize: `${Math.max(8, fontSize - 2)}pt`, minWidth: '24px' }}>
                                    {g.gender}
                                </button>
                                
                                {/* 비고 영역 */}
                                <input className="room-screen-input flex-1 min-w-[20px] text-slate-500 outline-none bg-transparent" style={{ fontSize: `${Math.max(9, fontSize - 1)}pt` }} placeholder={isSharedMode ? "(비고 입력)" : ""} value={g.remark} onChange={(e) => updateGuest(globalIdx, gIdx, 'remark', e.target.value)} />
                                <div className="room-print-text flex-1 text-slate-500" style={{ fontSize: `${Math.max(9, fontSize - 1)}pt` }}>{g.remark || ' '}</div>
                            </div>
                            {isInternationalRooming && (
                                <React.Fragment>
                                    <input className="room-screen-input font-bold tracking-wide text-slate-500 outline-none uppercase bg-transparent w-full mt-0.5 min-w-0" style={{ fontSize: `${Math.max(8, fontSize - 1.5)}pt` }} placeholder="ENGLISH NAME" value={g.engName} onChange={(e) => updateGuest(globalIdx, gIdx, 'engName', e.target.value)} />
                                    <div className="room-print-text font-bold tracking-wide text-slate-500 uppercase w-full mt-0.5" style={{ fontSize: `${Math.max(8, fontSize - 1.5)}pt` }}>{g.engName || ' '}</div>
                                </React.Fragment>
                            )}
                        </div>
                    ))}
                </div>

                <div className="flex items-center justify-center p-1 bg-white min-w-0 relative">

            // 엑셀 날짜는 타임존 없는 '달력 날짜'인데, SheetJS cellDates는 JS Date로 바꿔
            // 한국(과거 UTC+8:30 등)에서 생년월일·만료일이 하루 전으로 밀린다.
            // 시리얼 숫자는 UTC 달력 연산으로만 변환하고, Date 객체의 getDate()는 쓰지 않는다.
            const pad2 = (n) => String(n).padStart(2, '0');
            const toYmd = (y, m, d) => {
                if (!Number.isFinite(y) || !Number.isFinite(m) || !Number.isFinite(d)) return '';
                if (m < 1 || m > 12 || d < 1 || d > 31) return '';
                if (y < 100) y += (y > 50 ? 1900 : 2000);
                if (y < 1900 || y > 2100) return '';
                return `${y}-${pad2(m)}-${pad2(d)}`;
            };
            const excelSerialToYmd = (serial) => {
                const n = Math.floor(Number(serial) + 1e-8);
                if (n < 1 || n >= 2958466) return '';
                const utc = new Date(Date.UTC(1899, 11, 31));
                utc.setUTCDate(utc.getUTCDate() + (n >= 60 ? n - 1 : n));
                return toYmd(utc.getUTCFullYear(), utc.getUTCMonth() + 1, utc.getUTCDate());
            };
            const parseDateString = (raw) => {
                if (raw === undefined || raw === null) return '';
                let str = String(raw).trim();
                if (!str) return '';
                const compact = str.replace(/\./g, '-').replace(/\//g, '-').replace(/,/g, '-').replace(/년|월/g, '-').replace(/일/g, '').replace(/\s/g, '');
                const stdMatch = compact.match(/^(\d{2,4})-(\d{1,2})-(\d{1,2})$/);
                if (stdMatch) return toYmd(parseInt(stdMatch[1], 10), parseInt(stdMatch[2], 10), parseInt(stdMatch[3], 10));
                if (/^\d{8}$/.test(compact)) return toYmd(parseInt(compact.slice(0, 4), 10), parseInt(compact.slice(4, 6), 10), parseInt(compact.slice(6, 8), 10));
                if (/^\d{5,6}$/.test(compact)) {
                    const padded = compact.padStart(6, '0');
                    return toYmd(parseInt(padded.slice(0, 2), 10), parseInt(padded.slice(2, 4), 10), parseInt(padded.slice(4, 6), 10));
                }
                return '';
            };
            const parseExcelDateCell = (cell) => {
                if (!cell || cell.v === undefined || cell.v === null || cell.v === '') return '';
                const v = cell.v;
                if (typeof v === 'number' && Number.isFinite(v)) {
                    const intv = Math.floor(v + 1e-8);
                    if (intv >= 19000101 && intv <= 21001231) {
                        const s = String(intv);
                        const parsed = toYmd(parseInt(s.slice(0, 4), 10), parseInt(s.slice(4, 6), 10), parseInt(s.slice(6, 8), 10));
                        if (parsed) return parsed;
                    }
                    if (intv >= 100000 && intv <= 991231) {
                        const s = String(intv).padStart(6, '0');
                        const parsed = toYmd(parseInt(s.slice(0, 2), 10), parseInt(s.slice(2, 4), 10), parseInt(s.slice(4, 6), 10));
                        if (parsed) return parsed;
                    }
                    const serial = excelSerialToYmd(v);
                    if (serial) return serial;
                }
                return parseDateString(v) || String(v).trim();

            const TRAVELER_DATE_COLS = [3, 6];

                        const cell = ws[addr];
                        if (!cell || cell.v === undefined || cell.v === null || cell.v === '') return;
                        const asText = (typeof cell.v === 'number')

                        cell.v = asText;

                    else if (/<sheetPr\s*\/>/.test(xml)) xml = xml.replace(/<sheetPr\s*\/>/, '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>');

                const setup = `<pageSetup paperSize="9" scale="77" fitToWidth="1" fitToHeight="${fitToHeight}" orientation="portrait" horizontalDpi="600" verticalDpi="600"/>`;

                else if (xml.includes('<pageMargins')) xml = xml.replace(/(<pageMargins[^>]*\/>)/, `$1${setup}`);

                    XLSX.writeFile(wb, filename);
                    return;
                }
                const zip = await JSZip.loadAsync(raw);
                const paths = Object.keys(zip.files).filter((n) => /xl\/worksheets\/sheet\d+\.xml$/.test(n));
                for (const path of paths) {
                    let xml = await zip.file(path).async('string');
                    zip.file(path, injectA4PrintSetup(xml, fitToHeight));
                }
                const blob = await zip.generateAsync({
                    type: 'blob',
                    mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                    compression: 'DEFLATE'
                });
                const a = document.createElement('a');

                        ws[cell].s = s;
                    }
                }
                forceDateCellsAsText(ws);
                
                const rowHeights = Array(ws_data.length).fill({ hpt: 25 });

                rowHeights[emptyRowIdx] = { hpt: 15 };
                rowHeights[logoRowIdx] = { hpt: 26 };
                ws['!rows'] = rowHeights; 

                ws['!cols'] = [{ wch: 7 }, { wch: 13 }, { wch: 23 }, { wch: 15 }, { wch: 11 }, { wch: 17 }, { wch: 15 }, { wch: 9 }, { wch: 19 }];
                ws['!margins'] = { left: 0.25, right: 0.25, top: 0.75, bottom: 0.75, header: 0.3, footer: 0.3 };

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "여행자명단");
                const dataRowCount = emptyRowIdx - 1;
                await downloadWorkbookA4(wb, commonHeader.groupName ? `${commonHeader.groupName}_여행자명단.xlsx` : `투어메이커_여행자명단.xlsx`, dataRowCount <= 40 ? 1 : 0);
            };


            // ==========================================
            // [TAB 2] 방 배정 (루밍리스트)
            // ==========================================
            const [isInternationalRooming, setIsInternationalRooming] = useState(true);
            const ROOM_CAPACITY = { SINGLE: 1, TWIN: 2, TRIPLE: 3, QUAD: 4 };
            const ROOM_TYPE_KO = { SINGLE: '1인실', TWIN: '2인실', TRIPLE: '3인실', QUAD: '4인실' };
            const createEmptyGuest = () => ({ name: '', engName: '', gender: '남', remark: '' });
            const createRoomByType = (type) => {
                const safeType = ROOM_CAPACITY[type] ? type : 'TWIN';
                const capacity = ROOM_CAPACITY[safeType];
                return {
                    id: Date.now() + Math.random(),
                    type: safeType,
                    roomNo: '',
                    guests: Array.from({ length: capacity }, () => createEmptyGuest())
                };
            };
            const createDefaultRooms = () => ([createRoomByType('TWIN')]);
            const [rooms, setRooms] = useState(createDefaultRooms);
            const [roomPreset, setRoomPreset] = useState({ TWIN: 10, TRIPLE: 0, SINGLE: 0, QUAD: 0 });
            const [importTextRooming, setImportTextRooming] = useState("");

            const dragRoomItem = useRef();
            const dragOverRoomItem = useRef();

            const dragRoomStart = (e, position) => { dragRoomItem.current = position; e.target.closest('.room-row')?.classList.add('dragging'); };
            const dragRoomEnter = (e, position) => { dragOverRoomItem.current = position; };
            const dropRoom = (e) => {
                const tr = e.target.closest('.room-row');
                if (tr) tr.classList.remove('dragging');
                if (dragRoomItem.current === undefined || dragRoomItem.current === null || dragOverRoomItem.current === undefined || dragOverRoomItem.current === null) return;
                setRooms(prev => {
                    const copyRooms = [...prev];
                    const dragContent = copyRooms[dragRoomItem.current];
                    if (!dragContent) return prev;
                    copyRooms.splice(dragRoomItem.current, 1);
                    copyRooms.splice(dragOverRoomItem.current, 0, dragContent);
                    return copyRooms;
                });
                dragRoomItem.current = null; dragOverRoomItem.current = null;
            };
            const dragRoomEnd = (e) => { e.target.closest('.room-row')?.classList.remove('dragging'); dragRoomItem.current = null; dragOverRoomItem.current = null;};

            const safeText = (v) => String(v ?? '').trim();
            const normalizeGuest = (guest = {}) => ({
                name: safeText(guest.name),
                engName: safeText(guest.engName).toUpperCase(),
                gender: guest.gender === '여' ? '여' : '남',
                remark: safeText(guest.remark)
            });
            const normalizeRoom = (room = {}) => {
                const type = ROOM_CAPACITY[room.type] ? room.type : 'TWIN';
                const capacity = ROOM_CAPACITY[type];
                let guests = Array.isArray(room.guests) ? room.guests.map(normalizeGuest) : [];
                while (guests.length < capacity) guests.push({ name: '', engName: '', gender: '남', remark: '' });
                guests = guests.slice(0, capacity);
                return {
                    id: room.id || Date.now() + Math.random(),
                    type,
                    roomNo: safeText(room.roomNo),
                    guests
                };
            };
            const sanitizeRooms = (targetRooms = rooms) => {
                const normalized = (Array.isArray(targetRooms) ? targetRooms : []).map(normalizeRoom);
                return normalized.length > 0 ? normalized : [{ id: Date.now(), type: 'TWIN', roomNo: '', guests: [{name:'', engName:'', gender:'남', remark:''}, {name:'', engName:'', gender:'남', remark:''}] }];
            };
            
            const computeRoomStats = (targetRooms = rooms) => {
                let total = 0, male = 0, female = 0;
                let roomCounts = { SINGLE: 0, TWIN: 0, TRIPLE: 0, QUAD: 0 };
                sanitizeRooms(targetRooms).forEach(r => {
                    const hasGuest = r.guests.some(g => safeText(g.name) !== '');
                    if (hasGuest && roomCounts[r.type] !== undefined) roomCounts[r.type]++;
                    r.guests.forEach(g => {
                        if (safeText(g.name) !== "") {
                            total++;
                            if (g.gender === '여') female++; else male++;
                        }
                    });
                });
                return { total, male, female, roomCounts };
            };
            
            const validateRoomingData = (targetRooms = rooms) => {
                const normalizedRooms = sanitizeRooms(targetRooms);
                const errors = [];
                const warnings = [];
                let namedGuestCount = 0;
                const nameCounter = new Map();
                normalizedRooms.forEach((room, rIdx) => {
                    room.guests.forEach((guest, gIdx) => {
                        if (!guest.name) return;
                        namedGuestCount++;
                        const key = `${guest.name}|${guest.engName}`;
                        nameCounter.set(key, (nameCounter.get(key) || 0) + 1);
                        if (isInternationalRooming && !guest.engName) {
                            errors.push(`${rIdx + 1}번 객실 ${gIdx + 1}번째 인원의 영문명이 비어 있습니다.`);
                        }
                        if (isInternationalRooming && guest.engName.length > 28) {
                            warnings.push(`${rIdx + 1}번 객실 ${guest.name} 영문명이 길어 인쇄 시 줄바꿈됩니다.`);
                        }
                    });
                });
                if (namedGuestCount === 0) errors.push('방 배정된 인원이 없습니다.');
                if (namedGuestCount > ROOMING_MAX_PAX) {
                    errors.push(`배정 인원이 ${ROOMING_MAX_PAX}명을 초과했습니다. (현재 ${namedGuestCount}명)`);
                } else if (namedGuestCount > 150) {
                    warnings.push(`대규모 단체(${namedGuestCount}명)입니다. 인쇄 시 여러 페이지로 나뉘며, 미리보기로 확인해 주세요.`);
                }
                for (const [key, count] of nameCounter.entries()) {
                    const [name] = key.split('|');
                    if (name && count > 1) warnings.push(`${name} 이름이 ${count}회 중복 배정되어 있습니다.`);
                }
                return { errors, warnings, rooms: normalizedRooms, stats: computeRoomStats(normalizedRooms) };
            };
            
            const getStableEventCode = () => {
                const current = safeText(commonHeader.eventCode);
                if (current) return current;
                const nextCode = generateEventCode();
                setCommonHeader(prev => ({ ...prev, eventCode: nextCode }));
                return nextCode;
            };
            
            const buildEventConfigPayload = (eventCode) => ({
                eventCode,
                commonHeader: { ...commonHeader, eventCode },
                isInternationalRooming,
                docFontSize,
                rooms: sanitizeRooms(rooms),
                stats: computeRoomStats(rooms),
                updatedAt: new Date().toISOString(),
                schemaVersion: 'tourmaker-rooming-v2.2'
            });

            useEffect(() => {
                if (!user || !db || !isSharedMode || !urlEventCode) return;
                const loadSharedEventConfig = async () => {
                    try {
                        const { doc, getDoc } = window.FirebaseModules;
                        const eventRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooming_events', urlEventCode);
                        const snap = await getDoc(eventRef);
                        if (snap.exists()) {
                            const config = snap.data();
                            if (config.commonHeader) setCommonHeader(prev => ({ ...prev, ...config.commonHeader, eventCode: urlEventCode }));
                            if (Array.isArray(config.rooms)) setRooms(sanitizeRooms(config.rooms));
                            if (typeof config.isInternationalRooming === 'boolean') setIsInternationalRooming(config.isInternationalRooming);
                            if (typeof config.docFontSize === 'number') setDocFontSize(config.docFontSize);
                        }
                    } catch (err) {
                        console.error('Shared event config load error:', err);
                    }
                };
                loadSharedEventConfig();
            }, [user, db, isSharedMode, urlEventCode]);

            const roomStats = useMemo(() => computeRoomStats(rooms), [rooms, isInternationalRooming]);

            const { roomPages, totalRoomPages, isLargeGroup: isLargeRoomingGroup } = useMemo(() => {
                return buildRoomPages(sanitizeRooms(rooms), isInternationalRooming, docFontSize);
            }, [rooms, isInternationalRooming, docFontSize]);

            const downloadRoomingExcelTemplate = () => {
                const ws_data = [
                    ['순서', '성명', '영문명(NAME)', '성별', '객실번호', '기타'],
                    [1, '홍길동', 'HONG GILDONG', '남', '101호', '인솔자'],
                    [1, '김철수', 'KIM CHULSOO', '남', '', ''],
                    [2, '이영희', 'LEE YOUNGHEE', '여', '202호', ''],
                    [2, '박민지', 'PARK MINJI', '여', '', ''],
                    [2, '최수진', 'CHOI SUJIN', '여', '', ''],
                    ['', '', '', '', '', ''],
                    ['', '', '', '', 'System Powered by TOURMAKER', '']
                ];
                const ws = XLSX.utils.aoa_to_sheet(ws_data);
                
                ws['!merges'] = [
                    { s: { r: 1, c: 0 }, e: { r: 2, c: 0 } }, 
                    { s: { r: 1, c: 4 }, e: { r: 2, c: 4 } }, 
                    { s: { r: 3, c: 0 }, e: { r: 5, c: 0 } }, 
                    { s: { r: 3, c: 4 }, e: { r: 5, c: 4 } },  
                    { s: { r: 7, c: 4 }, e: { r: 7, c: 5 } }  
                ];
                
                const borders = [2, 5]; 

                const headerStyle = { font: { name: '맑은 고딕', sz: 11, bold: true, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "047857" } }, alignment: { horizontal: "center", vertical: "center" } };
                const dataStyle = { font: { name: '맑은 고딕', sz: 10 }, alignment: { horizontal: "center", vertical: "center" } };
                const logoStyle = { font: { name: 'Arial Black', sz: 10, bold: true, italic: true, color: { rgb: "1E3A8A" } }, alignment: { horizontal: "right", vertical: "center" } };

                const range = XLSX.utils.decode_range(ws['!ref']);
                for (let R = range.s.r; R <= range.e.r; ++R) {
                    for (let C = range.s.c; C <= range.e.c; ++C) {
                        const cell = XLSX.utils.encode_cell({ r: R, c: C });
                        if (!ws[cell]) continue;
                        
                        let s = R === 0 ? { ...headerStyle } : { ...dataStyle };
                        
                        if (R === 6 || R === 7) {
                            s.border = {}; 
                            if (R === 7 && C === 4) s = { ...logoStyle };
                        } else {
                            s.border = { left: { style: "thin", color: { rgb: "CBD5E1" } }, right: { style: "thin", color: { rgb: "CBD5E1" } } };
                            if (R === 0) {
                                s.border.top = { style: "thick", color: { rgb: "000000" } };
                                s.border.bottom = { style: "thick", color: { rgb: "000000" } };
                            } else {
                                s.border.top = { style: "thin", color: { rgb: "E2E8F0" } };
                                if (borders.includes(R)) s.border.bottom = { style: "medium", color: { rgb: "64748B" } };
                                else s.border.bottom = { style: "thin", color: { rgb: "E2E8F0" } };
                            }
                        }
                        ws[cell].s = s;
                    }
                }
                ws['!rows'] = [{ hpt: 25 }, { hpt: 20 }, { hpt: 20 }, { hpt: 20 }, { hpt: 20 }, { hpt: 20 }, { hpt: 15 }, { hpt: 25 }];
                ws['!cols'] = [{ wch: 6 }, { wch: 14 }, { wch: 22 }, { wch: 8 }, { wch: 20 }, { wch: 20 }];

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "방배정_표준양식");
                XLSX.writeFile(wb, "투어메이커_루밍표준양식.xlsx");
            };

            const getWorksheetCellText = (worksheet, rowIdx, colIdx) => {
                const merges = worksheet['!merges'] || [];
                for (const merge of merges) {
                    if (rowIdx >= merge.s.r && rowIdx <= merge.e.r && colIdx >= merge.s.c && colIdx <= merge.e.c) {
                        const originAddr = XLSX.utils.encode_cell({ r: merge.s.r, c: merge.s.c });
                        const originCell = worksheet[originAddr];
                        if (originCell == null) return '';
                        return String(originCell.w ?? originCell.v ?? '').trim();
                    }
                }
                const addr = XLSX.utils.encode_cell({ r: rowIdx, c: colIdx });
                const cell = worksheet[addr];
                if (cell == null) return '';
                return String(cell.w ?? cell.v ?? '').trim();
            };

            const roomHasNamedGuest = (room) => {
                if (!room || !Array.isArray(room.guests)) return false;
                return room.guests.some(g => safeText(g.name) !== '' || safeText(g.engName) !== '');
            };

            const pushParsedRoom = (targetRooms, room) => {
                if (roomHasNamedGuest(room)) targetRooms.push(room);
            };

            const importRoomingExcelData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        // [마스터 패치] cellDates: true 복구
                        const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: true });

                        let currentRoom = null;
                        const newRooms = [];
                        let lastOrder = null;

                        for (let i = 1; i < json.length; i++) {
                            const row = json[i];
                            if (!row || row.length === 0) continue;

                            // 병합 셀(순번·객실번호) 값 보정 — 엑셀 수정 후에도 원본 그룹 유지
                            const orderStr = getWorksheetCellText(worksheet, i, 0) || String(row[0] || '').trim();
                            const roomNoStr = getWorksheetCellText(worksheet, i, 4) || String(row[4] || '').trim();
                            const nameStr = String(row[1] || '').trim();
                            const engNameStr = String(row[2] || '').trim().toUpperCase();
                            
                            // 빈 줄이거나 시스템 푸터인 경우 건너뜀
                            if (nameStr === '' && orderStr === '' && engNameStr === '' && roomNoStr === '') continue;
                            if (nameStr.includes('System Powered') || roomNoStr.includes('System Powered')) continue;

                            const hasGuestData = nameStr !== '' || engNameStr !== '';
                            const isNewRoomGroup = !currentRoom || (orderStr !== '' && orderStr !== lastOrder);

                            // 순번만 남고 인원이 삭제된 행(빈 객실 잔재)은 새 방으로 만들지 않음
                            if (isNewRoomGroup && hasGuestData) {
                                pushParsedRoom(newRooms, currentRoom);
                                currentRoom = {
                                    id: Date.now() + Math.random() + i,
                                    roomNo: roomNoStr,
                                    type: 'TWIN',
                                    guests: []
                                };
                                if (orderStr !== '') lastOrder = orderStr;
                            } else if (isNewRoomGroup && !hasGuestData) {
                                continue;
                            }

                            if (!currentRoom) continue;

                            if (roomNoStr && !currentRoom.roomNo) currentRoom.roomNo = roomNoStr;

                            if (hasGuestData) {
                                const finalEngName = engNameStr !== '' ? engNameStr : (isInternationalRooming ? koreanToEnglish(nameStr) : "");
                                currentRoom.guests.push({
                                    name: nameStr,
                                    engName: finalEngName,
                                    gender: String(row[3] || '').trim() === '여' || String(row[3] || '').trim().toUpperCase() === 'F' ? '여' : '남',
                                    remark: String(row[5] || '').trim()
                                });
                            }
                        }
                        pushParsedRoom(newRooms, currentRoom);

                        // 타입(SGL, TWN, TRP, QUAD) 재계산 및 빈칸(Placeholder) 채우기
                        const formattedRooms = newRooms.map(r => {
                            let type = 'TWIN';
                            const gLen = r.guests.length;
                            if (gLen <= 1) type = 'SINGLE';
                            else if (gLen === 2) type = 'TWIN';
                            else if (gLen === 3) type = 'TRIPLE';
                            else type = 'QUAD';

                            const capacity = type === 'SINGLE' ? 1 : (type === 'TWIN' ? 2 : (type === 'TRIPLE' ? 3 : 4));
                            const paddedGuests = [...r.guests];
                            while(paddedGuests.length < capacity) paddedGuests.push({ name: "", engName: "", gender: "남", remark: "" });

                            return { ...r, type, guests: paddedGuests.slice(0, capacity) };
                        });

                        if (formattedRooms.length > 0) {
                            const guestTotal = formattedRooms.reduce((sum, r) => sum + r.guests.filter(g => safeText(g.name) !== '').length, 0);
                            if (guestTotal > ROOMING_MAX_PAX) {
                                showAlert(`⚠️ 배정 인원이 ${ROOMING_MAX_PAX}명을 초과합니다. (현재 ${guestTotal}명)\n${ROOMING_MAX_PAX}명 이하로 조정 후 다시 업로드해 주세요.`);
                                e.target.value = '';
                                return;
                            }
                            setRooms(formattedRooms);
                            const pagePreview = buildRoomPages(formattedRooms, isInternationalRooming, docFontSize);
                            const pageNote = pagePreview.totalRoomPages > 1 ? `\n· 인쇄 예상: ${pagePreview.totalRoomPages}페이지` : '';
                            const largeNote = guestTotal > 150 ? '\n\n※ 대규모 단체입니다. PDF 인쇄 미리보기로 페이지별 확인을 권장합니다.' : '';
                            showAlert(`✅ 엑셀 반영 완료\n· 객실: ${formattedRooms.length}개\n· 배정 인원: ${guestTotal}명${pageNote}${largeNote}`);
                        } else {
                            showAlert("⚠️ 유효한 방 배정 데이터가 없습니다.\n(순번만 남고 이름이 모두 삭제된 행은 무시됩니다.)");
                        }
                    } catch (error) { 
                        showAlert("⚠️ 엑셀 파싱 오류가 발생했습니다. 양식을 확인해 주세요."); 
                        console.error(error);
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = ''; // 동일 파일 재업로드 허용
            };

            const exportRoomingToExcel = () => {
                const ws_data = [['순서', '성명', '영문명(NAME)', '성별', '객실번호', '기타']];
                const borders = []; 
                const merges = [];

                let currentRowIdx = 1;
                rooms.forEach((r, idx) => {
                    const roomNumberDisplay = idx + 1;
                    const startRow = currentRowIdx;
                    let addedCount = 0;

                    r.guests.forEach((g) => {
                        if (g.name.trim() !== "" || r.roomNo.trim() !== "") {
                            ws_data.push([roomNumberDisplay, g.name, g.engName, g.gender, r.roomNo, g.remark]);
                            currentRowIdx++;
                            addedCount++;
                        }
                    });

                    if (addedCount > 0) {
                        borders.push(currentRowIdx - 1); 
                        if (addedCount > 1) {
                            merges.push({ s: { r: startRow, c: 0 }, e: { r: currentRowIdx - 1, c: 0 } });
                            merges.push({ s: { r: startRow, c: 4 }, e: { r: currentRowIdx - 1, c: 4 } });
                        }
                    }
                });

                if (ws_data.length === 1) return showAlert("⚠️ 내보낼 방 배정 데이터가 없습니다.");

                ws_data.push(['', '', '', '', '', '']); 
                const emptyRowIdx = currentRowIdx;
                currentRowIdx++;

                ws_data.push(['', '', '', '', 'System Powered by TOURMAKER', '']);
                const logoRowIdx = currentRowIdx;
                merges.push({ s: { r: logoRowIdx, c: 4 }, e: { r: logoRowIdx, c: 5 } }); 

                const ws = XLSX.utils.aoa_to_sheet(ws_data);
                if (merges.length > 0) ws['!merges'] = merges;

                const headerStyle = { font: { name: '맑은 고딕', sz: 11, bold: true, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "047857" } }, alignment: { horizontal: "center", vertical: "center" } };
                const dataStyle = { font: { name: '맑은 고딕', sz: 10 }, alignment: { horizontal: "center", vertical: "center" } };
                const logoStyle = { font: { name: 'Arial Black', sz: 12, bold: true, italic: true, color: { rgb: "1E3A8A" } }, alignment: { horizontal: "right", vertical: "center" } };

                const range = XLSX.utils.decode_range(ws['!ref']);
                for (let R = range.s.r; R <= range.e.r; ++R) {
                    for (let C = range.s.c; C <= range.e.c; ++C) {
                        const cell = XLSX.utils.encode_cell({ r: R, c: C });
                        if (!ws[cell]) continue;

                        let s = R === 0 ? { ...headerStyle } : { ...dataStyle };
                        
                        if (R === emptyRowIdx || R === logoRowIdx) {
                            s.border = {}; 
                            if (R === logoRowIdx && C === 4) s = { ...logoStyle };
                        } else {
                            s.border = { left: { style: "thin", color: { rgb: "CBD5E1" } }, right: { style: "thin", color: { rgb: "CBD5E1" } } };
                            if (R === 0) {
                                s.border.top = { style: "thick", color: { rgb: "000000" } };
                                s.border.bottom = { style: "thick", color: { rgb: "000000" } };
                            } else {
                                s.border.top = { style: "thin", color: { rgb: "E2E8F0" } };
                                if (borders.includes(R)) s.border.bottom = { style: "medium", color: { rgb: "64748B" } };
                                else s.border.bottom = { style: "thin", color: { rgb: "E2E8F0" } };
                            }
                        }
                        ws[cell].s = s;
                    }
                }
                
                const rowHeights = Array(ws_data.length).fill({ hpt: 20 });
                rowHeights[0] = { hpt: 25 }; 
                rowHeights[emptyRowIdx] = { hpt: 15 };
                rowHeights[logoRowIdx] = { hpt: 25 };
                ws['!rows'] = rowHeights; 
                
                ws['!cols'] = [{ wch: 6 }, { wch: 14 }, { wch: 22 }, { wch: 8 }, { wch: 20 }, { wch: 20 }];

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "방배정_명단");
                XLSX.writeFile(wb, commonHeader.groupName ? `${commonHeader.groupName}_방배정명단.xlsx` : `투어메이커_루밍리스트.xlsx`);
            };

            const handleRoomingSmartImport = () => {
                if (!importTextRooming.trim()) return;
                const lines = importTextRooming.split('\n').filter(l => l.trim().length > 0);
                const newRooms = lines.map((line, idx) => {
                    const rawNames = line.split(/[\s,/\t]+/).map(name => name.trim()).filter(Boolean);
                    const guests = rawNames.map(raw => {
                        const hasFemale = raw.includes('(여)') || /여$/.test(raw);
                        const cleanName = raw.replace(/\(여\)|\(남\)|여$|남$/g, '').trim();
                        return { name: cleanName, engName: isInternationalRooming ? koreanToEnglish(cleanName) : "", gender: hasFemale ? "여" : "남", remark: "" };
                    });
                    let type = 'TWIN';
                    if (guests.length <= 1) type = 'SINGLE';
                    else if (guests.length === 2) type = 'TWIN';
                    else if (guests.length === 3) type = 'TRIPLE';
                    else type = 'QUAD';
                    return { id: Date.now() + Math.random(), roomNo: "", type, guests: guests.slice(0, type === 'SINGLE' ? 1 : type === 'TWIN' ? 2 : type === 'TRIPLE' ? 3 : 4) };
                });
                
                setRooms(prev => {
                    if (prev.length === 1 && prev[0].guests.every(g => g.name === "")) return newRooms;
                    return [...prev, ...newRooms];
                });
                setImportTextRooming("");
            };

            const updateRoom = (rIdx, field, value) => { setRooms(prev => prev.map((room, idx) => idx === rIdx ? { ...room, [field]: value } : room)); };
            const updateGuest = (globalIdx, gIdx, field, value) => {
                setRooms(prev => prev.map((room, rIndex) => {
                    if (rIndex === globalIdx) {
                        const newGuests = room.guests.map((guest, guestIndex) => {
                            if (guestIndex === gIdx) {
                                const updatedGuest = { ...guest, [field]: value };
                                if (field === 'name' && isInternationalRooming) {
                                    if (!guest.engName || guest.engName === koreanToEnglish(guest.name)) {
                                        updatedGuest.engName = koreanToEnglish(value);
                                    }
                                }
                                if (field === 'engName') updatedGuest.engName = String(value).toUpperCase();
                                return updatedGuest;
                            }
                            return guest;
                        });
                        return { ...room, guests: newGuests };
                    }
                    return room;
                }));
            };

            const changeRoomType = (globalIdx, type) => {
                setRooms(prev => prev.map((room, rIndex) => {
                    if (rIndex === globalIdx) {
                        const capacity = type === 'SINGLE' ? 1 : (type === 'TWIN' ? 2 : (type === 'TRIPLE' ? 3 : 4));
                        let currentGuests = [...room.guests];
                        if (currentGuests.length < capacity) {
                            while(currentGuests.length < capacity) currentGuests.push({ name: "", engName: "", gender: "남", remark: "" });
                        } else {
                            currentGuests = currentGuests.slice(0, capacity);
                        }
                        return { ...room, type, guests: currentGuests };
                    }
                    return room;
                }));
            };

            const removeRoom = (globalIdx) => setRooms(prev => prev.filter((_, idx) => idx !== globalIdx));
            const addRoom = () => setRooms(prev => [...prev, createRoomByType('TWIN')]);

            const applyRoomPreset = () => {
                const counts = {
                    TWIN: Math.max(0, parseInt(roomPreset.TWIN, 10) || 0),
                    TRIPLE: Math.max(0, parseInt(roomPreset.TRIPLE, 10) || 0),
                    SINGLE: Math.max(0, parseInt(roomPreset.SINGLE, 10) || 0),
                    QUAD: Math.max(0, parseInt(roomPreset.QUAD, 10) || 0)
                };
                const totalRooms = counts.TWIN + counts.TRIPLE + counts.SINGLE + counts.QUAD;
                if (totalRooms === 0) {
                    showAlert('⚠️ 방 개수를 1개 이상 입력해 주세요.');
                    return;
                }
                const hasNamedGuests = rooms.some(r => r.guests.some(g => safeText(g.name)));
                const buildRooms = () => {
                    const next = [];
                    ['TWIN', 'TRIPLE', 'SINGLE', 'QUAD'].forEach((type) => {
                        for (let i = 0; i < counts[type]; i++) next.push(createRoomByType(type));
                    });
                    setRooms(next);
                    showAlert(`✅ 빈 객실 ${totalRooms}개를 만들었습니다.\n(2인실 ${counts.TWIN} · 3인실 ${counts.TRIPLE} · 1인실 ${counts.SINGLE} · 4인실 ${counts.QUAD})\n\n이제 링크를 복사해 담당자에게 보내세요.`);
                };
                if (hasNamedGuests) {
                    setModal({
                        isOpen: true,
                        type: 'confirm',
                        message: '이미 입력된 이름 배정이 있습니다.\n이 구성으로 빈 방을 다시 만들면 기존 내용이 삭제됩니다. 계속할까요?',
                        inputValue: '',
                        onConfirm: () => {
                            setModal({ isOpen: false, type: 'alert', message: '', inputValue: '', onConfirm: null, onCancel: null, onChange: null });
                            buildRooms();
                        },
                        onCancel: () => { setModal({ isOpen: false, type: 'alert', message: '', inputValue: '', onConfirm: null, onCancel: null, onChange: null }); }
                    });
                    return;
                }
                buildRooms();
            };

            const enterSharedPreview = () => {
                if (!rooms.length) {
                    showAlert('⚠️ 먼저 방 구성을 만들어 주세요.');
                    return;
                }
                setActiveMainTab('rooming');
                setIsSharedMode(true);
            };

            const exitSharedPreview = () => {
                if (isUrlShared) return;
                setIsSharedMode(false);
                setActiveMainTab('rooming');
            };

            const handleResetRooming = () => {
                setModal({
                    isOpen: true,
                    type: 'confirm',
                    message: '방 배정을 모두 초기화할까요?\n\n· 현재 객실·인원 배정이 삭제됩니다.\n· 복붙 입력창 내용도 함께 지워집니다.\n· 빈 TWIN 1실 상태로 돌아갑니다.',
                    inputValue: '',
                    onConfirm: () => {
                        setRooms(createDefaultRooms());
                        setImportTextRooming('');
                        setModal({ isOpen: false, type: 'alert', message: '', inputValue: '', onConfirm: null, onCancel: null, onChange: null });
                        showAlert('✅ 방 배정이 초기화되었습니다.');
                    },
                    onCancel: () => { setModal({ isOpen: false, type: 'alert', message: '', inputValue: '', onConfirm: null, onCancel: null, onChange: null }); }
                });
            };

            const handleCopyLink = async () => {
                const currentCode = getStableEventCode();
                const baseUrl = window.location.origin + window.location.pathname;
                const shareUrl = `${baseUrl}?shared=true&code=${encodeURIComponent(currentCode)}`;

                try {
                    if (!db || !user) {
                        showAlert("⚠️ 서버 연결이 아직 완료되지 않았습니다. 잠시 후 다시 시도해 주세요.");
                        return;
                    }
                    const { doc, setDoc } = window.FirebaseModules;
                    const eventRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooming_events', currentCode);
                    await setDoc(eventRef, buildEventConfigPayload(currentCode), { merge: true });
                } catch (err) {
                    console.error('Event config save error:', err);
                    showAlert("⚠️ 공유 링크용 기본 데이터를 저장하지 못했습니다. Firebase 권한/네트워크를 확인해 주세요.");
                    return;
                }

                fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(shareUrl)}`)
                    .then(res => res.json())
                    .then(data => { executeCopy(data.shorturl || shareUrl); })
                    .catch(() => { executeCopy(shareUrl); });
            };

            const executeCopy = (urlToCopy) => {
                const textArea = document.createElement("textarea");
                textArea.value = urlToCopy; textArea.style.position = "fixed"; textArea.style.top = "-9999px"; textArea.style.left = "-9999px";
                document.body.appendChild(textArea); textArea.focus(); textArea.select();
                try {
                    const successful = document.execCommand('copy');
                    if(successful) showAlert(`✅ 고객 전용 배정 링크(${urlToCopy})가 복사되었습니다! 담당자에게 전달해주세요.`);
                    else showPrompt("자동 복사에 실패했습니다. 복사해주세요:", urlToCopy, () => {});
                } catch (err) { showPrompt("자동 복사에 실패했습니다. 복사해주세요:", urlToCopy, () => {}); } 
                finally { document.body.removeChild(textArea); }
            };

            const handlePrint = () => {
                if(isSharedMode) {
                    showPrintConfirm();
                } else {
                    setTimeout(() => { window.print(); }, 100);
                }
            };

            const handleSubmitRooming = () => {
                // 담당자는 한글 이름만 입력 → 제출 시 영문명 자동 보완(해외 인쇄/호텔용)
                const roomsReady = sanitizeRooms(rooms).map(room => ({
                    ...room,
                    guests: room.guests.map(guest => ({
                        ...guest,
                        engName: guest.engName || (guest.name ? koreanToEnglish(guest.name) : '')
                    }))
                }));
                setRooms(roomsReady);

                const check = validateRoomingData(roomsReady);
                if (check.errors.length > 0) {
                    showAlert(`⚠️ 제출 전 확인이 필요합니다.\n\n${check.errors.join('\n')}`);
                    return;
                }
                if (!db || !user) {
                    if (!isUrlShared) {
                        showAlert('✅ 미리보기에서는 제출 서버 연결 없이 작성 UX만 확인합니다.\n실제 담당자 링크에서는 여기서 제출됩니다.');
                        return;
                    }
                    showAlert("⚠️ 서버 연결이 아직 완료되지 않았습니다. 잠시 후 다시 시도해 주세요.");
                    return;
                }

                const warningText = check.warnings.length > 0 ? `\n\n참고 확인사항:\n${check.warnings.slice(0, 5).join('\n')}${check.warnings.length > 5 ? '\n...' : ''}` : '';

                showPrompt(`마지막 단계입니다!\n담당자 확인을 위해 '단체명' 또는 '고객명'을 입력해 주세요.\n(예: 소속 기관명 또는 성함)${warningText}`, "", async (submitterName) => {
                    if(!submitterName || submitterName.trim() === "") {
                        showAlert("⚠️ 단체명 또는 고객명을 입력해야 제출이 가능합니다.");
                        return;
                    }

                    try {
                        const { collection, addDoc } = window.FirebaseModules;
                        const currentCode = getStableEventCode();
                        const subRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooming_submissions');
                        const normalizedRooms = roomsReady;
                        const normalizedStats = computeRoomStats(normalizedRooms);
                        await addDoc(subRef, {
                            eventCode: currentCode,
                            groupName: commonHeader.groupName || '미지정 단체',
                            submitterName: submitterName.trim(),
                            submittedAt: new Date().toISOString(),
                            commonHeader: { ...commonHeader, eventCode: currentCode },
                            isInternationalRooming,
                            rooms: normalizedRooms,
                            stats: normalizedStats,
                            schemaVersion: 'tourmaker-rooming-v2.3'
                        });
                        setSubmitSuccess(true);
                    } catch(err) {
                        console.error(err);
                        showAlert("⚠️ 서버 통신 중 오류가 발생했습니다. Firebase 권한 또는 네트워크 상태를 확인해 주세요.");
                    }
                });
            };

            const loadSubmission = (submission) => {
                setModal({
                    isOpen: true,
                    type: 'confirm',
                    message: `해당 배정본(${submission.submitterName} 제출)을 현재 화면에 덮어씌웁니다.\n기존 화면에 작성 중이던 내용은 사라집니다. 계속하시겠습니까?`,
                    inputValue: '',
                    onConfirm: () => {
                        const loadedRooms = sanitizeRooms(submission.rooms || []);
                        setRooms(loadedRooms);
                        if (submission.commonHeader) {
                            setCommonHeader(prev => ({ ...prev, ...submission.commonHeader, eventCode: submission.eventCode || prev.eventCode }));
                        }
                        if (typeof submission.isInternationalRooming === 'boolean') {
                            setIsInternationalRooming(submission.isInternationalRooming);
                        }
                        setActiveMainTab('rooming');
                        setModal({ isOpen: false, type: 'alert', message: '', inputValue: '', onConfirm: null, onCancel: null, onChange: null }); 
                        showAlert("✅ 고객 제출본이 현재 화면에 동일 데이터 기준으로 적용되었습니다. PDF 인쇄 또는 엑셀 저장 전 한 번만 검수해 주세요.");
                    },
                    onCancel: () => { setModal({ isOpen: false, type: 'alert', message: '', inputValue: '', onConfirm: null, onCancel: null, onChange: null }); }
                });
            };

            const handleDeleteSubmission = (subId) => {
                setModal({
                    isOpen: true,
                    type: 'confirm',
                    message: '이 제출본을 정말 삭제하시겠습니까?\n삭제된 데이터는 복구할 수 없습니다.',
                    inputValue: '',
                    onConfirm: async () => {
                        try {
                            const { doc, deleteDoc } = window.FirebaseModules;
                            const subRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooming_submissions', subId);
                            await deleteDoc(subRef);
                            setModal({ isOpen: false, type: 'alert', message: '', inputValue: '', onConfirm: null, onCancel: null, onChange: null });
                            showAlert("✅ 불필요한 제출본이 성공적으로 삭제되었습니다.");
                        } catch (err) {
                            console.error("Delete error:", err);
                            showAlert("⚠️ 삭제 중 오류가 발생했습니다.");
                        }
                    },
                    onCancel: () => { setModal({ isOpen: false, type: 'alert', message: '', inputValue: '', onConfirm: null, onCancel: null, onChange: null }); }
                });
            };

            if (isLoading) {
                return <div className="min-h-screen flex items-center justify-center bg-slate-800 flex-col gap-4"><div className="spinner"></div><p className="text-white font-bold">보안 시스템 연결 중...</p></div>;
            }

            if (submitSuccess) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50 flex-col px-4 text-center">
                        <div className="bg-white p-8 md:p-12 rounded-2xl shadow-xl max-w-lg w-full border border-slate-100">
                            <div className="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                <i className="fas fa-check text-4xl text-emerald-500"></i>
                            </div>
                            <h2 className="text-2xl md:text-3xl font-black text-slate-800 mb-4">제출이 잘 되었습니다!</h2>
                            <p className="text-lg text-slate-600 font-bold mb-2">바쁘신 와중에 작성해 주셔서 진심으로 감사합니다.</p>
                            <p className="text-slate-500 mb-8">안전하고 성공적인 행사가 되도록 최선을 다하겠습니다.</p>
                            <p className="text-sm text-slate-400 bg-slate-100 py-2 px-4 rounded-lg inline-block font-bold">이제 이 창을 닫으셔도 좋습니다.</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 relative">
                    {/* 상단 헤더 */}
                    <div className="no-print bg-[#1e293b] border-b shadow-md sticky top-0 z-50">
                        <div className="max-w-[1400px] mx-auto px-3 md:px-4 flex flex-col md:flex-row justify-between items-center py-2 md:py-0 gap-2 md:gap-3">
                            <div className="flex w-full md:w-auto justify-center md:justify-start items-center pb-1 md:pb-0">
                                <div className="flex items-center gap-2 md:gap-3">
                                    <img src={TM_LOGO} className="h-5 md:h-6 filter brightness-0 invert" alt="Tourmaker Logo" />
                                    <div className="h-3 md:h-4 w-[1px] bg-slate-500"></div>
                                    <h1 className="font-bold text-white tracking-wide text-xs md:text-sm">{isSharedMode ? '객실 배정 요청' : '통합 관리 센터'}</h1>
                                </div>
                            </div>
                            
                            <div className="flex w-full md:w-auto justify-center overflow-x-auto hide-scrollbar items-center gap-2">
                                {isSharedMode && !isUrlShared && (
                                    <button onClick={exitSharedPreview} className="whitespace-nowrap px-3 py-2 text-[12px] md:text-sm font-bold text-amber-300 border border-amber-400/40 rounded-lg hover:bg-slate-800">
                                        <i className="fas fa-arrow-left mr-1"></i> 관리자로 돌아가기
                                    </button>
                                )}
                                {!isSharedMode && (
                                    <button onClick={() => setActiveMainTab('traveler')} className={`whitespace-nowrap px-3 md:px-5 py-2 md:py-4 h-full flex items-center font-bold text-[13px] md:text-sm border-b-[3px] transition-all md:rounded-t-md ${activeMainTab === 'traveler' ? 'border-blue-400 text-white bg-slate-800' : 'border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>
                                        <i className="fas fa-passport mr-2"></i> 1. 여행자 명단
                                    </button>
                                )}
                                <button onClick={() => setActiveMainTab('rooming')} className={`whitespace-nowrap px-3 md:px-5 py-2 md:py-4 h-full flex items-center font-bold text-[13px] md:text-sm border-b-[3px] transition-all md:rounded-t-md ${activeMainTab === 'rooming' ? 'border-blue-400 text-white bg-slate-800' : 'border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>
                                        <i className="fas fa-bed mr-2"></i> {isSharedMode ? '방 배정 작성' : '2. 방 배정 (루밍)'}
                                </button>
                                {!isSharedMode && (
                                    <button onClick={() => setActiveMainTab('results')} className={`whitespace-nowrap px-3 md:px-5 py-2 md:py-4 h-full flex items-center font-bold text-[13px] md:text-sm border-b-[3px] transition-all md:rounded-t-md ${activeMainTab === 'results' ? 'border-emerald-400 text-emerald-400 bg-slate-800' : 'border-transparent text-slate-400 hover:text-emerald-200 hover:bg-slate-800'}`}>
                                        <i className="fas fa-inbox mr-2"></i> 3. 방배정 완료 <span className="ml-2 bg-emerald-500 text-white text-[10px] px-1.5 py-0.5 rounded-full">{submissions.length}</span>
                                    </button>
                                )}
                            </div>

                            <div className="flex w-full md:w-auto justify-end items-center gap-2 pt-1 md:pt-0 border-t border-slate-700 md:border-none">
                                {!isSharedMode && (
                                    <React.Fragment>
                                        <div className="hidden lg:flex items-center gap-2 mr-2 bg-slate-800 px-2 py-1 rounded text-xs">
                                            <span className="text-slate-400 whitespace-nowrap">공유 코드:</span>
                                            <input type="text" className="bg-transparent text-emerald-400 font-bold w-24 xl:w-40 outline-none text-center transition-all" value={commonHeader.eventCode} onChange={e=>setCommonHeader({...commonHeader, eventCode: e.target.value})} placeholder="코드" />
                                        </div>
                                        <button onClick={handleCopyLink} className="text-emerald-300 hover:text-emerald-100 px-2 py-1.5 text-xs font-bold transition flex items-center gap-1 whitespace-nowrap" title="고객 설문 전송용 링크 복사"><i className="fas fa-link"></i> 링크 복사</button>
                                    </React.Fragment>
                                )}

                                        {(modal.type === 'prompt' || modal.type === 'confirm') && <button onClick={modal.onCancel} className="px-5 py-2.5 bg-slate-100 text-slate-600 rounded-lg font-bold hover:bg-slate-200">취소(닫기)</button>}
                                        <button onClick={modal.onConfirm} className="px-5 py-2.5 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 shadow-sm">
                                            {modal.type === 'confirm' ? "확인(적용)" : "확인"}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
